name: Java and Docker CI

on:
  push:
    branches: [master, develop, release, 'release/**', 'feature/**']
  pull_request:
    branches: [master, develop, release, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build JAR and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Start a temporary MySQL database for integration testing
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: world
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml

      # Import the World database into the temporary MySQL container
      - name: Import World database
        run: |
          docker exec -i "${{ job.services.mysql.id }}" \
            mysql -uroot -pci_test_password world \
            < world-db/world.sql

      # Execute unit tests and integration tests
      - name: Build and test with Maven
        env:
          DB_URL: jdbc:mysql://localhost:3307/world
          DB_USER: root
          DB_PASSWORD: ci_test_password
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Run the executable JAR
        timeout-minutes: 1
        run: java -jar target/semcode.jar

      - name: Build the Docker image
        run: docker build --tag semcode:ci .

      # Run the starter application in Docker
      - name: Run the application in Docker
        timeout-minutes: 1
        run: docker run --rm --network none semcode:ci

      - name: Save the executable JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semcode-jar
          path: target/semcode.jar
          if-no-files-found: error
          retention-days: 14