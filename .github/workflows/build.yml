name: Java and Docker CI

on:
  push:
    branches: [master, develop, release, 'release/**', 'feature/**']
  pull_request:
    branches: [master, develop, release, 'release/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build JAR and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Temporary MySQL database used only for CI integration tests.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: world
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Import World database
        run: |
          docker exec -i "${{ job.services.mysql.id }}" \
            mysql -uroot -pci_test_password world \
            < world-db/world.sql

      - name: Build and test with Maven
        env:
          DB_URL: jdbc:mysql://localhost:3307/world
          DB_USER: root
          DB_PASSWORD: ci_test_password
        run: mvn --batch-mode --no-transfer-progress clean verify
        -name: Save JaCoCo coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days:14      - name: Run the executable JAR
        timeout-minutes: 1
        run: java -jar target/semcode.jar

      - name: Build the Docker image
        run: docker build --tag semcode:ci .

      - name: Run the application in Docker
        timeout-minutes: 1
        run: docker run --rm --network none semcode:ci

      # Only trusted pushes to develop publish an image; pull requests do not.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag semcode:ci "$IMAGE_NAME:${GITHUB_SHA}"
          docker tag semcode:ci "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"

      - name: Save the executable JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semcode-jar
          path: target/semcode.jar
          if-no-files-found: error
          retention-days: 14
