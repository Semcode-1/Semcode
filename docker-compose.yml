services:
  mysql:
    build: ./world-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: world
      MYSQL_USER: semuser
      MYSQL_PASSWORD: ${DB_PASSWORD:-sempass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # TCP avoids passing against MySQL's temporary initialization server.
      # Querying the schema also checks that import and user grants are complete.
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -u$$MYSQL_USER world -e 'SELECT Code FROM country LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    image: ${SEMCODE_IMAGE:-semcode:local}
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/world?allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=10000&socketTimeout=30000
      DB_USER: semuser
      DB_PASSWORD: ${DB_PASSWORD:-sempass}
    command: ["${TOP_N:-5}"]
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
